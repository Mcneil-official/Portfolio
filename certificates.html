<html lang="en">

        <style>
            /* Critical first-paint styles while full CSS loads */
            html, body { margin: 0; max-width: 100%; overflow-x: hidden; }
            body { background: #f8fafc; color: #0f172a; }
            .page-loader {
                position: fixed;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                background: rgba(255, 255, 255, 0.96);
                z-index: 3000;
                opacity: 1;
                visibility: visible;
            }
            .page-loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s ease, visibility .35s ease; }
            .loader-svg { height: 62px; width: 100px; }
        </style>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body class="bg-slate-50 text-slate-900 antialiased">
        <div id="loader-root"></div>
        <div id="sidebar-root"></div>

        <main class="main-content min-h-screen w-full px-4 py-4 sm:px-6 lg:ml-20 lg:px-10">
            <div class="content-wrapper mx-auto w-full max-w-[1120px]">
                <section class="pt-10 pb-6 lg:pt-16">
                    <h1 class="m-0 font-display text-3xl font-extrabold tracking-tight text-slate-900 lg:text-5xl">Certifications</h1>
                    <div class="mt-3 h-1 w-16 rounded-full bg-indigo-700"></div>
                    <p class="mt-6 max-w-2xl text-slate-500">Credentials, trainings, and certifications I've earned. Click any card to view the certificate and credential link.</p>
                </section>

                <section id="certificates-page" class="reveal pb-12 pt-2">
                    <div id="certificates-grid" class="grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
                </section>

                <hr class="my-6 border-slate-200" />
                <div id="footer-root"></div>
            </div>
        </main>

        <div id="modal-root"></div>

        <script defer src="layout.js"></script>
        <script defer src="main.js"></script>
    </body>
</html>
